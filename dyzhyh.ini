[custom]
 
 ;不要随意改变关键字，否则会导致出错
 
 ;acl4SSR规则
 
 
 ;去广告：支持
 ;自动测速：支持
 ;微软分流：支持
 ;苹果分流：支持
 ;增强中国IP段：支持
 ;增强国外GFW：支持
 
 
 ;设置规则标志位
 ; 移除重复的规则集，只保留必要的
 ruleset=🎯 全球直连, `https://jxz.840120.xyz/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list` 
 ruleset=🎯 全球直连, `https://jxz.840120.xyz/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list` 
 ruleset=📹 油管视频, `https://jxz.840120.xyz/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list` 
 ruleset=💬 电报消息, `https://jxz.840120.xyz/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list` 
 ruleset=🌍 国外媒体, `https://jxz.840120.xyz/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list` 
 ruleset=🚀 节点选择, `https://jxz.840120.xyz/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list` 
 ruleset=🎯 全球直连, `https://jxz.840120.xyz/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list` 
 ruleset=🎯 全球直连, `https://jxz.840120.xyz/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list` 
 ruleset=🎯 全球直连,[]GEOIP,CN
 ruleset=🐟 漏网之鱼,[]FINAL
 
 ;设置规则标志位
 
 
 ;设置分组标志位
 ; 简化代理组结构，优化 YouTube 相关配置
 custom_proxy_group=🚀 节点选择`select`[]🚀 高速节点`[]♻️ 自动选择`[]🇭🇰 香港`[]🇰🇷 韩国`[]🇸🇬 新加坡`[]🇯🇵 日本`[]DIRECT
 custom_proxy_group=♻️ 自动选择`fallback`.*` `http://www.gstatic.com/generate_204` `180,,2
 custom_proxy_group=🚀 高速节点`url-test`.*高速.*` `http://www.gstatic.com/generate_204` `10,,3000
 custom_proxy_group=🇭🇰 香港`fallback`(香港|HK|HongKong|HONGKONG)` `http://www.gstatic.com/generate_204` `180,,2
 custom_proxy_group=📹 油管视频`select`[]🚀 高速节点`[]🇭🇰 香港`[]🇰🇷 韩国`[]🇸🇬 新加坡`[]🇯🇵 日本`[]DIRECT
 custom_proxy_group=💬 电报消息`select`[]🚀 高速节点`[]🇭🇰 香港`[]DIRECT
 custom_proxy_group=🌍 国外媒体`select`[]🚀 高速节点`[]🇭🇰 香港`[]DIRECT
 custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 高速节点
 custom_proxy_group=🐟 漏网之鱼`select`[]🚀 高速节点`[]DIRECT
 
 ;设置分组标志位
 
 
 enable_rule_generator=true
 overwrite_original_rules=true
 
 ; 启用规则优化
 rule_generator_optimize=true
 ; 移除游戏规则
 exclude_rules=game
 ; 优先匹配 YouTube 规则
 priority_rules=YouTube
