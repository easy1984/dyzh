proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - 🚀 高速节点
      - ♻️ 自动选择
      - 🚀 手动切换
      - DIRECT
  - name: 🚀 手动切换
    type: select
    proxies:
      - server ShadowTLS
      - server grpc-reality
      - server h2-reality
      - server shadowsocks
      - server trojan
      - server tuic
      - server vless-ws-tls
      - server vmess-ws
      - 高速Hysteria2-misaka
      - 高速server hysteria2
      - 高速server xtls-reality
  - name: ♻️ 自动选择
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 2
    proxies:
      - server ShadowTLS
      - server grpc-reality
      - server h2-reality
      - server shadowsocks
      - server trojan
      - server tuic
      - server vless-ws-tls
      - server vmess-ws
      - 高速Hysteria2-misaka
      - 高速server hysteria2
      - 高速server xtls-reality
  - name: 🚀 高速节点
