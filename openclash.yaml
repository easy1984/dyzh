port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
ipv6: true
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: true
  prefer-h3: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  nameserver:
    - 223.5.5.5

# --- 在线规则集（MetaCubeX/meta-rules-dat，mrs 格式）---
rule-providers:
  LocalAreaNetwork:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs
